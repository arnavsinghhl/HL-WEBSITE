services:
  - type: web
    name: hl-website
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /opt/render/project/src/storage/backend-data
      - key: ADMIN_ACCESS_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: hl-website-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
